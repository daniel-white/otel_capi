language = "C"
style = "Type"
header = "/* Generated by cbindgen. Do not edit; edit the Rust sources instead. */"
include_guard = "COTEL_H"
tab_width = 2
documentation = true
usize_is_size_t = true


[export]
include = [
  "otel_result_t",
  "otel_runtime_t",
  "otel_span_status_t",
  "otel_severity_t",
  "otel_attribute_type_t",
  "otel_attribute_value_t",
  "otel_attribute_t",
]
item_types = ["enums", "unions", "structs", "typedefs", "functions", "constants"]

[enum]
prefix_with_name = false
rename_variants = "None"

