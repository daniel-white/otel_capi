language = "C"
style = "Type"
header = "/* Generated by cbindgen. Do not edit; edit the Rust sources instead. */"
include_guard = "COTEL_H"
tab_width = 2
documentation = true
usize_is_size_t = true

after_includes = """
#ifndef OTEL_API
#  if defined(_WIN32) && defined(COTEL_BUILDING_DLL)
#    define OTEL_API __declspec(dllexport)
#  elif defined(_WIN32)
#    define OTEL_API __declspec(dllimport)
#  elif defined(__GNUC__)
#    define OTEL_API __attribute__((visibility("default")))
#  else
#    define OTEL_API
#  endif
#endif

#ifdef __cplusplus
extern "C" {
#endif

/* Ownership convention
 *
 * Handles are caller-allocated. Declare `otel_foo_t foo = {0};` and pass a
 * pointer to the matching `otel_foo_new` or `otel_foo_retain` function; the
 * library writes into that storage and never allocates the struct. On success
 * the struct owns one reference, so pair it with `otel_foo_release`, which
 * clears the struct and is safe to call on a zero-initialized one.
 *
 * All strings are borrowed for the duration of a call only.
 */
"""

[export]
include = [
  "otel_result_t",
  "otel_runtime_t",
  "otel_span_status_t",
  "otel_severity_t",
  "otel_attribute_type_t",
  "otel_attribute_value_t",
  "otel_attribute_t",
]
item_types = ["enums", "unions", "structs", "typedefs", "functions", "constants"]

[enum]
prefix_with_name = false
rename_variants = "None"

