language = "C"
style = "Type"
header = "/* Generated by otel-capi-http-transport/build.rs. Do not edit. */"
include_guard = "OTEL_CAPI_HTTP_TRANSPORT_H"
tab_width = 2
documentation = true
usize_is_size_t = true

after_includes = """
#include \"otel_capi_common.h\"
"""

[export]
include = [
  "otel_http_transport_t",
  "otel_http_transport_options_t",
  "otel_http_transport_abi_version",
  "otel_http_transport_new",
  "otel_http_transport_send",
  "otel_http_transport_register",
  "otel_http_transport_release",
]
exclude = [
  "otel_result_t",
  "otel_str_t",
  "otel_runtime_t",
  "otel_set_transport_fn",
  "otel_transport_t",
  "otel_transport_header_t",
  "otel_transport_request_t",
  "otel_transport_response_t",
  "otel_transport_send_fn",
]
item_types = ["structs", "functions"]
