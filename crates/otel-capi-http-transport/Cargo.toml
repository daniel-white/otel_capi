[package]
name = "otel-capi-http-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared HTTP transport for otel-capi loadable exporters"

[lib]
name = "otel_capi_http_transport"
crate-type = ["rlib"]

[dependencies]
otel-capi = { path = "../otel-capi", default-features = false, features = ["abi"] }
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }
