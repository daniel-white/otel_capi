[package]
name = "otel-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C API for OpenTelemetry"

[lib]
name = "otel_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["full"]
# Full C SDK. Enable this for the core shared/static library.
full = [
  "dep:async-trait",
  "dep:http",
  "dep:opentelemetry",
  "dep:opentelemetry-http",
  "dep:opentelemetry-proto",
  "dep:opentelemetry_sdk",
  "dep:prost",
  "internal-logs",
]
# Forward OpenTelemetry's internal warning log support to the C library.
internal-logs = ["opentelemetry/internal-logs"]
# Shared C ABI types only. Exporter crates depend on this to avoid
# duplicating the core request/response contract or re-exporting core symbols.
abi = []

[build-dependencies]
cbindgen = "0.29.4"
opentelemetry-semantic-conventions = "0.33.1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
async-trait = { version = "0.1", optional = true }
http = { version = "1", optional = true }
opentelemetry = { version = "0.33.1", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry_sdk = { version = "0.33.1", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-http = { version = "0.33.1", default-features = false, optional = true }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = [
  "gen-tonic-messages",
  "trace",
  "metrics",
  "logs",
], optional = true }
prost = { version = "0.14", optional = true }
