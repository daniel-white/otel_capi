language = "C"
style = "Type"
header = "/* Generated by otel-capi-grpc-exporter/build.rs. Do not edit. */"
include_guard = "OTEL_CAPI_GRPC_EXPORTER_H"
tab_width = 2
documentation = true
usize_is_size_t = true

after_includes = """
#include \"otel_capi_common.h\"
"""

[export]
include = [
  "otel_grpc_exporter_t",
  "otel_grpc_exporter_options_t",
  "otel_grpc_exporter_abi_version",
  "otel_grpc_exporter_new",
  "otel_grpc_exporter_send",
  "otel_grpc_exporter_register",
  "otel_grpc_exporter_release",
]
exclude = [
  "otel_result_t",
  "otel_str_t",
  "otel_runtime_t",
  "otel_set_exporter_fn",
  "otel_exporter_t",
  "otel_exporter_header_t",
  "otel_exporter_request_t",
  "otel_exporter_response_t",
  "otel_exporter_send_fn",
]
item_types = ["structs", "functions"]
