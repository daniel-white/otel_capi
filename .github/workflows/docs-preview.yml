name: Docs preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  build-docs:
    name: Generate docs preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install documentation and native TLS dependencies
        run: sudo apt-get update && sudo apt-get install -y doxygen libssl-dev pkg-config

      - name: Generate API documentation
        run: make docs

      - name: Upload docs preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-pr-${{ github.event.pull_request.number }}
          path: build/docs/html

  comment:
    name: Link docs preview on PR
    needs: build-docs
    # GitHub gives fork PR workflows a read-only token, so the comment step is
    # skipped there. The artifact is still attached to the workflow run.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Post or update docs preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- otel-capi-docs-preview -->';
            const pr = context.payload.pull_request;
            const artifactName = `docs-pr-${pr.number}`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: artifactData } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const artifact = artifactData.artifacts.find((item) => item.name === artifactName);
            const docsUrl = artifact ? `${runUrl}/artifacts/${artifact.id}` : runUrl;

            const body = [
              marker,
              '### Docs preview',
              '',
              `Built from \`${pr.head.sha.slice(0, 7)}\` for this pull request.`,
              '',
              `- [Download the generated HTML docs](${docsUrl})`,
              `- [Workflow run](${runUrl})`,
              '',
              'The artifact contains `index.html` and the Doxygen pages, including `LINKING.md`.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
