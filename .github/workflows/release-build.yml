name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_REF: ${{ github.event.release.tag_name || inputs.tag }}
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.RELEASE_REF }}
        run: python3 scripts/package_release.py --target "$TARGET" --version "$VERSION" --target-dir "target/$TARGET/release"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.RELEASE_REF }}
        run: python scripts/package_release.py --target $env:TARGET --version $env:VERSION --target-dir "target/$env:TARGET/release"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256

  docs:
    name: API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Generate API documentation
        env:
          VERSION: ${{ env.RELEASE_REF }}
        run: |
          make docs
          version="${VERSION#v}"
          mkdir -p dist
          tar -C build/docs -czf "dist/otel-capi-${version}-docs.tar.gz" html
          (cd dist && shasum -a 256 "otel-capi-${version}-docs.tar.gz" > "otel-capi-${version}-docs.tar.gz.sha256")

      - name: Upload documentation
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          files: |
            dist/otel-capi-*-docs.tar.gz
            dist/otel-capi-*-docs.tar.gz.sha256
