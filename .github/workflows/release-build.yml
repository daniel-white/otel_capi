name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_REF: ${{ github.event.release.tag_name || inputs.tag }}
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install native TLS development files
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build core library
        run: cargo build --release --locked --target ${{ matrix.target }} -p otel-capi

      - name: Build optional gRPC exporter
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }} -p otel-capi-grpc-exporter

      - name: Build optional HTTP exporter
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }} -p otel-capi-http-exporter

      - name: Build optional stdout exporter
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }} -p otel-capi-stdout-exporter

      - name: Test musl kitchen sink
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work alpine:3 \
            sh -c 'apk add --no-cache build-base make && make example-musl MUSL_GCC=gcc'

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.RELEASE_REF }}
        run: python3 scripts/package_release.py --target "$TARGET" --version "$VERSION" --target-dir "target/$TARGET/release"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.RELEASE_REF }}
        run: python scripts/package_release.py --target $env:TARGET --version $env:VERSION --target-dir "target/$env:TARGET/release"

      - name: Verify library archive variants (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.RELEASE_REF }}
        run: |
          version="${VERSION#v}"
          for suffix in "" "-static" "-shared"; do
            base="dist/otel-capi-${version}-${TARGET}${suffix}"
            test -f "${base}.tar.gz"
            test -f "${base}.tar.gz.sha256"
          done

      - name: Upload release assets (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256)
          gh release upload "$RELEASE_REF" "${assets[@]}" --clobber

      - name: Verify library archive variants (Windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.RELEASE_REF }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $target = $env:TARGET
          foreach ($suffix in @('', '-static', '-shared')) {
            $base = "dist/otel-capi-$version-$($target)$($suffix)"
            if (-not (Test-Path "${base}.zip")) { throw "missing ${base}.zip" }
            if (-not (Test-Path "${base}.zip.sha256")) { throw "missing ${base}.zip.sha256" }
          }

      - name: Upload release assets (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @()
          $assets += Get-ChildItem -Path dist -Filter *.tar.gz -File | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem -Path dist -Filter *.tar.gz.sha256 -File | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem -Path dist -Filter *.zip -File | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem -Path dist -Filter *.zip.sha256 -File | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_REF @assets --clobber

  docs:
    name: API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install documentation and native TLS dependencies
        run: sudo apt-get update && sudo apt-get install -y doxygen libssl-dev pkg-config

      - name: Generate API documentation
        env:
          VERSION: ${{ env.RELEASE_REF }}
        run: |
          make docs
          touch build/docs/html/.nojekyll
          version="${VERSION#v}"
          mkdir -p dist
          tar -C build/docs -czf "dist/otel-capi-${version}-docs.tar.gz" html
          (cd dist && shasum -a 256 "otel-capi-${version}-docs.tar.gz" > "otel-capi-${version}-docs.tar.gz.sha256")

      - name: Upload documentation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(dist/otel-capi-*-docs.tar.gz dist/otel-capi-*-docs.tar.gz.sha256)
          gh release upload "$RELEASE_REF" "${assets[@]}" --clobber

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  publish-pages:
    name: Publish API docs to GitHub Pages
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
